# Console logging: readable step-by-step output while the suite drives the device.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# Appium/Selenium internals are noisy at INFO and drown out the test's own narrative.
org.slf4j.simpleLogger.log.io.appium=warn
org.slf4j.simpleLogger.log.org.openqa.selenium=warn
