# ---------------------------------------------------------------------------
# Defaults. Every key is overridable, highest precedence first:
#   1. JVM system property   ->  mvn test -Ddevice.name="Pixel 7 API 34"
#   2. Environment variable  ->  DEVICE_NAME="Pixel 7 API 34" mvn test
#   3. This file
# ---------------------------------------------------------------------------

# ANDROID or IOS
platform=ANDROID

# ---------------------------------------------------------------- Appium server
# When true the framework starts and stops a local Appium server itself, so the
# evaluator does not have to run `appium` in a second terminal.
appium.server.autostart=true
appium.server.url=http://127.0.0.1:4723
appium.server.startup.timeout.seconds=60

# ------------------------------------------------------------------ device
device.name=Android Emulator
platform.version=
# Leave blank to let Appium pick the only attached device; set for multi-device runs.
device.udid=

# ------------------------------------------------------------ application
# Either install from a local .apk/.app (app.path) or drive an already-installed
# build (app.package + app.activity). app.path wins when it is set.
app.path=
android.app.package=org.wikipedia
android.app.activity=org.wikipedia.main.MainActivity
ios.bundle.id=org.wikimedia.wikipedia

# ------------------------------------------------------------------ timeouts
# Explicit wait used by every page object. Deliberately one knob: a framework with
# five different wait constants is a framework nobody can tune.
wait.timeout.seconds=20
# Longer budget for the first launch, which includes app start and onboarding.
wait.startup.timeout.seconds=45
appium.new.command.timeout.seconds=120

# ------------------------------------------------------------------ behaviour
# false = keep app data between sessions; true = clean state per session (slower, more reliable).
reset.app.state=true
screenshot.on.failure=true
screenshot.directory=target/screenshots
# Retries for a failed test. Mobile UI runs are genuinely flaky at the device layer;
# 1 retry hides a stuck animation without hiding a real regression.
test.retry.count=1

# ---------------------------------------------------------------- test data
article.search.term=Artificial intelligence
# The reading list name gets a unique suffix at runtime so re-runs never collide.
reading.list.name.prefix=QA Automation List
