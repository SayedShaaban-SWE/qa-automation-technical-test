# ---------------------------------------------------------------------------
# Default configuration.
#
# Every key can be overridden without touching this file, in this order of
# precedence (highest first):
#   1. JVM system property   ->  mvn test -Dapi.base.uri=https://staging.example.com
#   2. Environment variable  ->  API_BASE_URI=https://staging.example.com mvn test
#   3. This file
# ---------------------------------------------------------------------------

api.base.uri=https://api.zippopotam.us

# Connection/socket timeouts for the underlying HTTP client (milliseconds).
http.connection.timeout.ms=10000
http.socket.timeout.ms=10000

# Non-functional budget asserted by ResponseTimeTest (milliseconds).
# Deliberately generous: this is a shared public API behind a CDN.
performance.response.time.sla.ms=3000

# ALL | HEADERS | BODY | STATUS | NONE - request/response logging on assertion failure.
logging.on.failure.detail=ALL
