# Parallel execution.
#
# These are stateless HTTP tests against a read-only endpoint, so running them concurrently is safe
# and cuts wall-clock time. It also proves the framework holds no mutable static state - the reason
# SpecFactory builds a fresh specification instead of mutating RestAssured's global fields.
#
# Concurrency is capped so the suite stays a well-behaved client of a free public API.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4

# Show the @DisplayName in the console output.
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores
